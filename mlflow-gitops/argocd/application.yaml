apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raniasupcom/mlops
    targetRevision: main
    path: mlflow-gitops/helm-values/mlflow
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true