# RBAC: webhook-service needs permission to patch the ml-app-serve Deployment
# so it can trigger a rollout restart (the equivalent of `kubectl rollout restart`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-service
  namespace: mlflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-service-deployment-restarter
  namespace: mlflow
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-service-deployment-restarter-binding
  namespace: mlflow
subjects:
  - kind: ServiceAccount
    name: webhook-service
    namespace: mlflow
roleRef:
  kind: Role
  name: webhook-service-deployment-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-service
  namespace: mlflow
  labels:
    app: webhook-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-service
  template:
    metadata:
      labels:
        app: webhook-service
    spec:
      serviceAccountName: webhook-service
      containers:
        - name: webhook-service
          image: YOUR_DOCKERHUB_USERNAME/mlflow-webhook-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: REGISTERED_MODEL_NAME
              value: "iris-classifier"
            - name: TARGET_STAGE
              value: "Production"
            - name: SERVE_NAMESPACE
              value: "mlflow"
            - name: SERVE_DEPLOYMENT
              value: "ml-app-serve"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-secret
                  key: secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: mlflow
spec:
  selector:
    app: webhook-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
